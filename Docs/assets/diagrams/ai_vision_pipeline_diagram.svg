<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 480" width="100%" height="100%" style="background:#0b0f19; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="40" y="20" width="1070" height="55" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="65" y="47" fill="#f8fafc" font-size="18" font-weight="700">Deep Vision &amp; Anti-Spoofing Inference Pipeline</text>
  <text x="65" y="64" fill="#94a3b8" font-size="12">YuNet Dynamic Detection (~14ms) • EMPR Liveness Filter • SFace 128-D Vector Match • Total Budget &lt; 40ms</text>
  <rect x="965" y="32" width="125" height="28" rx="6" fill="#059669" fill-opacity="0.2" stroke="#059669" stroke-width="1"/>
  <text x="1027" y="50" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">SUB-40MS EDGE AI</text>

  <!-- STEP 1: Video Ingestion -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="165" height="340" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="165" height="36" rx="12" fill="url(#grad-blue)"/>
    <rect x="0" y="24" width="165" height="12" fill="url(#grad-blue)"/>
    <text x="82" y="23" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">1. Video Ingestion</text>

    <rect x="12" y="55" width="141" height="65" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="20" y="78" fill="#38bdf8" font-size="11" font-weight="700">Webcam / RTSP</text>
    <text x="20" y="95" fill="#94a3b8" font-size="10">HTML5 getUserMedia</text>
    <text x="20" y="108" fill="#94a3b8" font-size="10">or IP Camera RTSP</text>

    <rect x="12" y="135" width="141" height="65" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="20" y="158" fill="#38bdf8" font-size="11" font-weight="700">Canvas JPEG Export</text>
    <text x="20" y="175" fill="#94a3b8" font-size="10">Quality Ratio: 0.60</text>
    <text x="20" y="188" fill="#94a3b8" font-size="10">~15KB Payload Size</text>

    <rect x="12" y="215" width="141" height="105" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="20" y="238" fill="#38bdf8" font-size="11" font-weight="700">REST Transport</text>
    <text x="20" y="255" fill="#94a3b8" font-size="10">POST /process_frame/</text>
    <text x="20" y="268" fill="#94a3b8" font-size="10">JWT Bearer Auth</text>
    <text x="20" y="281" fill="#94a3b8" font-size="10">Base64 JSON Buffer</text>
    <text x="20" y="302" fill="#38bdf8" font-size="10" font-weight="700">⚡ Latency: ~3ms</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 205 270 L 230 270" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STEP 2: YuNet Face Detection -->
  <g transform="translate(230, 100)">
    <rect x="0" y="0" width="165" height="340" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="165" height="36" rx="12" fill="url(#grad-purple)"/>
    <rect x="0" y="24" width="165" height="12" fill="url(#grad-purple)"/>
    <text x="82" y="23" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">2. YuNet Detection</text>

    <rect x="12" y="55" width="141" height="65" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="20" y="78" fill="#c084fc" font-size="11" font-weight="700">Dynamic ONNX</text>
    <text x="20" y="95" fill="#94a3b8" font-size="10">320×320 Tensor Input</text>
    <text x="20" y="108" fill="#94a3b8" font-size="10">FaceDetectorYN Engine</text>

    <rect x="12" y="135" width="141" height="65" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="20" y="158" fill="#c084fc" font-size="11" font-weight="700">Angle Invariance</text>
    <text x="20" y="175" fill="#94a3b8" font-size="10">Yaw / Pitch / Roll</text>
    <text x="20" y="188" fill="#94a3b8" font-size="10">Up to 45° Tilt Robust</text>

    <rect x="12" y="215" width="141" height="105" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="20" y="238" fill="#c084fc" font-size="11" font-weight="700">5-Point Landmarks</text>
    <text x="20" y="255" fill="#94a3b8" font-size="10">• Left / Right Pupils</text>
    <text x="20" y="268" fill="#94a3b8" font-size="10">• Nose Tip</text>
    <text x="20" y="281" fill="#94a3b8" font-size="10">• Mouth Corners</text>
    <text x="20" y="302" fill="#c084fc" font-size="10" font-weight="700">⚡ Latency: ~14ms</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 395 270 L 420 270" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STEP 3: EMPR Liveness Filter -->
  <g transform="translate(420, 100)">
    <rect x="0" y="0" width="165" height="340" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="165" height="36" rx="12" fill="url(#grad-amber)"/>
    <rect x="0" y="24" width="165" height="12" fill="url(#grad-amber)"/>
    <text x="82" y="23" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">3. EMPR Liveness</text>

    <rect x="12" y="55" width="141" height="65" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="20" y="78" fill="#fbbf24" font-size="11" font-weight="700">Geometric Ratios</text>
    <text x="20" y="95" fill="#94a3b8" font-size="10">r1 = Mouth / Eyes</text>
    <text x="20" y="108" fill="#94a3b8" font-size="10">r2 = Nose / Eyes</text>

    <rect x="12" y="135" width="141" height="65" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="20" y="158" fill="#fbbf24" font-size="11" font-weight="700">Temporal Window</text>
    <text x="20" y="175" fill="#94a3b8" font-size="10">FIFO Buffer (K=10)</text>
    <text x="20" y="188" fill="#94a3b8" font-size="10">Window: 3.0 Seconds</text>

    <rect x="12" y="215" width="141" height="105" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="20" y="238" fill="#fbbf24" font-size="11" font-weight="700">Variance Decision</text>
    <text x="20" y="255" fill="#f87171" font-size="10">Var = 0: REJECT SPOOF</text>
    <text x="20" y="268" fill="#34d399" font-size="10">Var &gt; 0: LIVE HUMAN</text>
    <text x="20" y="281" fill="#94a3b8" font-size="10">Zero User Prompts!</text>
    <text x="20" y="302" fill="#fbbf24" font-size="10" font-weight="700">⚡ Latency: ~0.4ms</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <path d="M 585 270 L 610 270" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STEP 4: SFace Deep Feature Extraction -->
  <g transform="translate(610, 100)">
    <rect x="0" y="0" width="165" height="340" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="165" height="36" rx="12" fill="url(#grad-teal)"/>
    <rect x="0" y="24" width="165" height="12" fill="url(#grad-teal)"/>
    <text x="82" y="23" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">4. SFace Embedding</text>

    <rect x="12" y="55" width="141" height="65" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="20" y="78" fill="#2dd4bf" font-size="11" font-weight="700">Affine Alignment</text>
    <text x="20" y="95" fill="#94a3b8" font-size="10">alignCrop Method</text>
    <text x="20" y="108" fill="#94a3b8" font-size="10">Normalized Crop (112²)</text>

    <rect x="12" y="135" width="141" height="65" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="20" y="158" fill="#2dd4bf" font-size="11" font-weight="700">128-D Unit Vector</text>
    <text x="20" y="175" fill="#94a3b8" font-size="10">Hyperspherical Margin</text>
    <text x="20" y="188" fill="#94a3b8" font-size="10">Float32 Dense Vector</text>

    <rect x="12" y="215" width="141" height="105" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="20" y="238" fill="#2dd4bf" font-size="11" font-weight="700">Feature Extraction</text>
    <text x="20" y="255" fill="#94a3b8" font-size="10">cv2.FaceRecognizerSF</text>
    <text x="20" y="268" fill="#94a3b8" font-size="10">Native C++ ONNX</text>
    <text x="20" y="281" fill="#94a3b8" font-size="10">One-Way Math Hash</text>
    <text x="20" y="302" fill="#2dd4bf" font-size="10" font-weight="700">⚡ Latency: ~18ms</text>
  </g>

  <!-- Arrow 4 to 5 -->
  <path d="M 775 270 L 800 270" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STEP 5: Vectorized Matrix Cosine Match -->
  <g transform="translate(800, 100)">
    <rect x="0" y="0" width="165" height="340" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="165" height="36" rx="12" fill="url(#grad-emerald)"/>
    <rect x="0" y="24" width="165" height="12" fill="url(#grad-emerald)"/>
    <text x="82" y="23" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">5. Vectorized Match</text>

    <rect x="12" y="55" width="141" height="65" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="20" y="78" fill="#34d399" font-size="11" font-weight="700">Library Matrix M</text>
    <text x="20" y="95" fill="#94a3b8" font-size="10">Shape: (N_Photos, 128)</text>
    <text x="20" y="108" fill="#94a3b8" font-size="10">In-Memory RAM Pool</text>

    <rect x="12" y="135" width="141" height="65" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="20" y="158" fill="#34d399" font-size="11" font-weight="700">BLAS Dot Product</text>
    <text x="20" y="175" fill="#94a3b8" font-size="10">S = (M · q) / norms</text>
    <text x="20" y="188" fill="#94a3b8" font-size="10">Parallel O(1) Search</text>

    <rect x="12" y="215" width="141" height="105" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="20" y="238" fill="#34d399" font-size="11" font-weight="700">Threshold Decision</text>
    <text x="20" y="255" fill="#34d399" font-size="10">Score &gt;= 0.45: MATCH</text>
    <text x="20" y="268" fill="#fbbf24" font-size="10">0.38-0.44: ALIGN FACE</text>
    <text x="20" y="281" fill="#94a3b8" font-size="10">&lt; 0.38: UNKNOWN</text>
    <text x="20" y="302" fill="#34d399" font-size="10" font-weight="700">⚡ Latency: ~0.8ms</text>
  </g>

  <!-- Arrow 5 to Output -->
  <path d="M 965 270 L 990 270" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STEP 6: Attendance Record Output -->
  <g transform="translate(990, 100)">
    <rect x="0" y="0" width="120" height="340" rx="12" fill="#111827" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="120" height="36" rx="12" fill="#059669"/>
    <rect x="0" y="24" width="120" height="12" fill="#059669"/>
    <text x="60" y="23" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Result</text>

    <text x="60" y="90" fill="#34d399" font-size="28" font-weight="800" text-anchor="middle">✅</text>
    <text x="60" y="115" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">Present</text>
    <text x="60" y="130" fill="#94a3b8" font-size="10" text-anchor="middle">Logged</text>

    <rect x="10" y="150" width="100" height="170" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="60" y="172" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">HUD Output</text>
    <text x="60" y="195" fill="#cbd5e1" font-size="9" text-anchor="middle">Cyan Box</text>
    <text x="60" y="210" fill="#cbd5e1" font-size="9" text-anchor="middle">Overlay</text>
    <text x="60" y="230" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">98.4% Conf</text>
    <text x="60" y="250" fill="#cbd5e1" font-size="9" text-anchor="middle">Timestamp</text>
    <text x="60" y="265" fill="#cbd5e1" font-size="9" text-anchor="middle">Atomic Lock</text>
    <text x="60" y="295" fill="#34d399" font-size="10" font-weight="800" text-anchor="middle">TOTAL:</text>
    <text x="60" y="310" fill="#34d399" font-size="11" font-weight="800" text-anchor="middle">~36.2 ms</text>
  </g>
</svg>
