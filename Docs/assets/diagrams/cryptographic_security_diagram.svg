<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="100%" style="background:#0b0f19; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <linearGradient id="grad-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="grad-slate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="40" y="20" width="1020" height="55" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="65" y="47" fill="#f8fafc" font-size="18" font-weight="700">Cryptographic Data Protection &amp; Zero-Plaintext Pipeline</text>
  <text x="65" y="64" fill="#94a3b8" font-size="12">Fernet AES-128-CBC • HMAC-SHA256 Authenticated Encryption • In-Memory RAM Stream Decryption</text>
  <rect x="910" y="32" width="135" height="28" rx="6" fill="#b91c1c" fill-opacity="0.2" stroke="#b91c1c" stroke-width="1"/>
  <text x="977" y="50" fill="#f87171" font-size="11" font-weight="700" text-anchor="middle">ZERO-LEAK PRIVACY</text>

  <!-- LEFT: Encryption at Rest Flow -->
  <g transform="translate(40, 95)">
    <rect x="0" y="0" width="480" height="360" rx="14" fill="#111827" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="480" height="38" rx="14" fill="url(#grad-red)"/>
    <rect x="0" y="26" width="480" height="12" fill="url(#grad-red)"/>
    <text x="240" y="25" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">A. Enrollment Encryption at Rest</text>

    <!-- Plaintext Image Source -->
    <rect x="25" y="55" width="430" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="40" y="80" fill="#f87171" font-size="12" font-weight="700">1. Student Enrollment Ingestion</text>
    <text x="40" y="100" fill="#cbd5e1" font-size="11">10-Shot Multi-Angle Camera Photos &amp; Form Fields (Phone, Address)</text>

    <path d="M 240 115 L 240 135" stroke="#f87171" stroke-width="2" marker-end="url(#arrow-red)"/>

    <!-- Fernet Engine -->
    <rect x="25" y="140" width="430" height="100" rx="8" fill="#1e293b" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="40" y="165" fill="#f87171" font-size="12" font-weight="700">2. SecurityUtils.encrypt_data()</text>
    <text x="40" y="185" fill="#cbd5e1" font-size="11">• Cipher: AES-128 in CBC Mode with PKCS7 Padding</text>
    <text x="40" y="202" fill="#cbd5e1" font-size="11">• Integrity: HMAC-SHA256 Authenticated Message Signature</text>
    <text x="40" y="222" fill="#94a3b8" font-size="10">Key: 256-bit URL-Safe Base64 Key from OS Environment</text>

    <path d="M 240 240 L 240 260" stroke="#f87171" stroke-width="2" marker-end="url(#arrow-red)"/>

    <!-- Ciphertext Storage -->
    <rect x="25" y="265" width="430" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="40" y="288" fill="#34d399" font-size="12" font-weight="700">3. Physical Storage (Zero Plaintext)</text>
    <text x="40" y="308" fill="#cbd5e1" font-size="11">• Images: media/face_data/*.jpg stored as Fernet binary blobs</text>
    <text x="40" y="325" fill="#cbd5e1" font-size="11">• PII: Encrypted text strings in PostgreSQL database columns</text>
  </g>

  <!-- RIGHT: Zero-Plaintext RAM Decryption Flow -->
  <g transform="translate(580, 95)">
    <rect x="0" y="0" width="480" height="360" rx="14" fill="#111827" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="480" height="38" rx="14" fill="url(#grad-green)"/>
    <rect x="0" y="26" width="480" height="12" fill="url(#grad-green)"/>
    <text x="240" y="25" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">B. Zero-Plaintext In-Memory Decryption Pipeline</text>

    <!-- Reading Ciphertext -->
    <rect x="25" y="55" width="430" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="40" y="80" fill="#34d399" font-size="12" font-weight="700">1. Raw Ciphertext Read from Disk</text>
    <text x="40" y="100" fill="#cbd5e1" font-size="11">with open(path, 'rb') as f: data = f.read()</text>

    <path d="M 240 115 L 240 135" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>

    <!-- In-RAM Decrypt -->
    <rect x="25" y="140" width="430" height="85" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1.5"/>
    <text x="40" y="165" fill="#34d399" font-size="12" font-weight="700">2. In-Memory Fernet Decryption (RAM Only)</text>
    <text x="40" y="185" fill="#cbd5e1" font-size="11">dec_data = SecurityUtils.decrypt_data(data)</text>
    <text x="40" y="205" fill="#f87171" font-size="11" font-weight="700">⚠️ ZERO PLAINTEXT BYTES EVER TOUCH THE PHYSICAL DISK!</text>

    <path d="M 240 225 L 240 245" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>

    <!-- Memory Buffer to OpenCV -->
    <rect x="25" y="250" width="430" height="90" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="40" y="272" fill="#34d399" font-size="12" font-weight="700">3. Buffer to OpenCV BGR Matrix</text>
    <text x="40" y="292" fill="#cbd5e1" font-size="11">img_arr = np.frombuffer(dec_data, np.uint8)</text>
    <text x="40" y="309" fill="#cbd5e1" font-size="11">img = cv2.imdecode(img_arr, cv2.IMREAD_COLOR)</text>
    <text x="40" y="327" fill="#94a3b8" font-size="10">Decoded frame exists strictly in RAM for SFace embedding extraction</text>
  </g>
</svg>
